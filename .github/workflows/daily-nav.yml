name: Daily NAV refresh

# Rebuilds Advisor.html with the latest AMFI NAVs + mfapi returns and commits it,
# so GitHub Pages redeploys automatically. 02:30 UTC = 08:00 IST, weekdays.

on:
  schedule:
    - cron: "30 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-nav
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Refresh NAVs and re-inject Advisor.html
        run: python mf_advisor/update_daily.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Advisor.html; then
            git add Advisor.html
            git commit -m "chore: daily NAV refresh ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No NAV changes today."
          fi
